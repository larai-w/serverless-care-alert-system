name: Unit tests

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Node ${{ matrix.node }} unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '24']
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run unit tests without application credentials
        run: |
          env -u CARE_ALERT_SECRET_ARN -u TWILIO_ACCOUNT_SID -u TWILIO_AUTH_TOKEN \
            -u TWILIO_FROM_NUMBER -u NURSE_PHONE_NUMBER -u PATIENT_NAME \
            -u BUTTON_SHARED_SECRET -u PUBLIC_CALLBACK_BASE \
            -u REQUIRE_TWILIO_SIGNATURE -u LINE_CHANNEL_ACCESS_TOKEN \
            -u LINE_USER_ID npm test
