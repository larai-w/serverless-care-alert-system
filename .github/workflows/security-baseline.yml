name: Security baseline

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Monday 03:17 JST (Sunday 18:17 UTC)
    - cron: '17 18 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Full-history secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Check public repository boundary
        run: python3 scripts/check_public_repo.py --tracked
      # Call the CLI directly: the action narrows PR/push scans to a diff.
      - name: Install gitleaks (pinned and checksum verified)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "${RUNNER_TEMP}/gitleaks" version
      - name: Scan fetched history
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/gitleaks
        run: |
          set -euo pipefail
          if [ "$(git rev-parse --is-shallow-repository)" != "false" ]; then
            echo "::error::Full-history scanning requires a non-shallow checkout."
            exit 1
          fi
          # All fetched refs, on every event. Unfetched/deleted refs are not covered.
          scan_log=$(mktemp)
          trap 'rm -f "$scan_log"' EXIT
          "$GITLEAKS_BIN" git . --log-opts="--all" --redact --no-banner --no-color --exit-code=1 2>&1 | tee "$scan_log"
          # A zero exit code alone does not prove Git history was read.
          if grep -Eq '(^|[[:space:]])(ERR|FTL)([[:space:]]|$)' "$scan_log"; then
            echo "::error::Gitleaks reported an operational error."
            exit 1
          fi
          scanned=$(sed -nE 's/.* ([0-9]+) commits scanned\..*/\1/p' "$scan_log")
          if ! [[ "$scanned" =~ ^[0-9]+$ ]] || [ "$scanned" -eq 0 ]; then
            echo "::error::Missing or zero scanned-commit count."
            exit 1
          fi
          echo "Scanned commits: $scanned (count is not a completeness proof)."
